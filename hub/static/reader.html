<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Live Captions</title>
<style>
  /* Light is the default; the theme is set on <html> so the whole page (not just the bar) follows it. */
  :root { --fs: 34px; --bg:#fff; --fg:#111; --dim:#595959; --line:#D0D4D7; --btn:#979797; --bar: 58px; color-scheme: light; }
  :root.dark { --bg:#000; --fg:#F7F7F7; --dim:#979797; --line:#333; --btn:#595959; color-scheme: dark; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font: 500 var(--fs)/1.35 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust:none; }
  #bar { position:fixed; top:0; left:0; right:0; height:var(--bar); box-sizing:border-box; display:flex; gap:8px;
    align-items:center; padding:0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    background:var(--bg); border-bottom:1px solid var(--line); font-size:17px; z-index:2; white-space:nowrap; }
  #bar button { font-size:20px; padding:6px 12px; border-radius:10px; border:1px solid var(--btn); background:transparent;
    color:var(--fg); flex:none; }
  #dot { width:12px; height:12px; border-radius:50%; background:#595959; flex:none; }
  #dot.on { background:#02CAF2; }
  #state { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #spacer { flex:1; }
  /* Newest line sits at the bottom of the screen and earlier lines stack up above it, like a chat.
     min-height pins the text to the bottom even before there's a screenful of it. */
  #log { box-sizing:border-box; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    justify-content:flex-end; padding: calc(var(--bar) + 12px) 18px calc(28px + env(safe-area-inset-bottom)); }
  #log p { margin:0 0 .55em; overflow-wrap:anywhere; }
  #partial { color:var(--dim); min-height:1.35em; margin:0; }
  #jump { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    display:none; padding:10px 22px; border-radius:24px; background:#097DDB; color:#fff; font-size:20px; border:0; z-index:3;
    box-shadow:0 2px 10px rgba(0,0,0,.25); }
  @media (max-width: 360px) { #bar button { padding:6px 9px; font-size:18px; } }
</style>
</head>
<body>
<div id="bar">
  <span id="dot"></span><span id="state">Connecting…</span><span id="spacer"></span>
  <button onclick="size(-4)" aria-label="Smaller text">A−</button><button onclick="size(4)" aria-label="Larger text">A+</button><button onclick="theme()" aria-label="Light or dark">☀︎/☾</button>
</div>
<div id="log"><div id="lines"></div><p id="partial"></p></div>
<button id="jump" onclick="toBottom(true)">↓ Live</button>
<script src="static/caption-client.js"></script>
<script>
  const linesEl = document.getElementById("lines"), partEl = document.getElementById("partial"),
        dot = document.getElementById("dot"), state = document.getElementById("state"), jump = document.getElementById("jump");
  const page = document.scrollingElement || document.documentElement;
  let follow = true, connected = false, live = false, pinned = 0;
  function show() {
    dot.classList.toggle("on", connected && live);
    state.textContent = !connected ? "Reconnecting…" : live ? "Live" : "Off right now";
  }
  function maxScroll() { return page.scrollHeight - window.innerHeight; }
  // Follow the newest line unless the reader has scrolled back. The check happens here, when a line
  // arrives, by comparing with where we last pinned the page - not in the scroll event, which the
  // browser can deliver after the next line has already pulled the page back down. Scrolls right away
  // (reading scrollHeight lays out the new line first) rather than on an animation frame.
  function toBottom(force) {
    // min(): when a revised partial line gets shorter the page shrinks and the browser pulls scrollY
    // up with it - that is not the reader scrolling back.
    if (!force && (!follow || window.scrollY < Math.min(pinned, maxScroll()) - 60)) {
      follow = false; jump.style.display = "block"; return;
    }
    follow = true;
    window.scrollTo(0, Math.max(0, maxScroll()));
    pinned = window.scrollY;
    jump.style.display = "none";
  }
  function add(t) {
    const p = document.createElement("p"); p.textContent = t; linesEl.appendChild(p);
    if (linesEl.children.length > 300) {          // keep a long sermon light; don't mistake the shrink for scrolling
      const before = page.scrollHeight;
      while (linesEl.children.length > 300) linesEl.firstChild.remove();
      pinned -= before - page.scrollHeight;
    }
    toBottom();
  }
  // Position decides: within 60px of the bottom = following, anywhere above = reading back.
  // (Every auto-scroll lands exactly at the bottom, so it can never look like scrolling back.)
  window.addEventListener("scroll", () => {
    follow = window.scrollY >= maxScroll() - 60;
    if (follow) pinned = window.scrollY;
    jump.style.display = follow ? "none" : "block";
  }, {passive: true});
  // Phone browsers resize the viewport as the address bar shows/hides; stay pinned to the bottom.
  const repin = () => { if (follow) toBottom(true); };
  window.addEventListener("resize", repin);
  window.visualViewport?.addEventListener("resize", repin);
  function size(d) { const v = Math.min(72, Math.max(20, parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs")) + d));
    document.documentElement.style.setProperty("--fs", v + "px"); try { localStorage.fs = v; } catch(e){} repin(); }
  function applyTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    document.querySelector('meta[name="theme-color"]').content = dark ? "#000000" : "#ffffff";
  }
  function theme() {
    const dark = !document.documentElement.classList.contains("dark");
    applyTheme(dark);
    try { localStorage.theme = dark ? "dark" : "light"; } catch(e){}
  }
  try {
    if (localStorage.fs) document.documentElement.style.setProperty("--fs", localStorage.fs + "px");
    applyTheme(localStorage.theme === "dark");      // light unless this phone chose dark
  } catch(e) { applyTheme(false); }
  connectCaptions({
    status: ok => { connected = ok; show(); },
    running: r => { live = r; show(); },
    snapshot: m => { linesEl.innerHTML = ""; m.history.forEach(add); partEl.textContent = m.partial || ""; live = m.running; show(); toBottom(true); },
    final: t => { partEl.textContent = ""; add(t); },
    partial: t => { partEl.textContent = t; toBottom(); },
    clear: () => { linesEl.innerHTML = ""; partEl.textContent = ""; },
  });
</script>
</body>
</html>
